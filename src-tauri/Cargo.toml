[package]
name = "devtoolsapp"
version = "2.0.0"
description = "DevToolsApp - Your Essential Developer Companion"
authors = ["Ahmed Shamim"]
license = "MIT"
repository = "https://github.com/me-shaon/devtools"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Test-only behaviour for the end-to-end smoke test. Release builds never enable it.
e2e = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
