name: Build App

on:
  workflow_call:
    inputs:
      release:
        description: Sign the bundles and create updater artifacts with the Production secrets.
        type: boolean
        default: false

jobs:
  build:
    name: build (${{ matrix.platform }}-${{ matrix.arch }})
    environment: ${{ inputs.release && 'Production' || '' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
            bundles: app,dmg
            e2e: true
          - os: macos-latest
            platform: darwin
            arch: x64
            target: x86_64-apple-darwin
            bundles: app,dmg
            e2e: true
          - os: windows-latest
            platform: win32
            arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
            e2e: true
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            e2e: true
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            e2e: true
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file rpm xvfb webkit2gtk-driver

      - name: Install dependencies
        run: npm ci

      - name: Configure signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Export only the values that exist. Tauri fails on empty signing variables.
          export_if_set() {
            if [ -n "${!1}" ]; then
              {
                echo "$1<<__SIGNING_EOF__"
                echo "${!1}"
                echo "__SIGNING_EOF__"
              } >> "$GITHUB_ENV"
            fi
          }

          build_args="--target ${{ matrix.target }} --bundles ${{ matrix.bundles }}"

          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            export_if_set TAURI_SIGNING_PRIVATE_KEY
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" >> "$GITHUB_ENV"
            build_args="$build_args --config src-tauri/tauri.updater.conf.json"
          elif [ "${{ inputs.release }}" = "true" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set. The release will not include updater artifacts."
          fi

          if [ "${{ runner.os }}" = "macOS" ]; then
            if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ]; then
              # Tauri decodes the certificate strictly. Remove line breaks and other
              # characters that are not base64, as electron-builder did.
              APPLE_CERTIFICATE=$(printf '%s' "$APPLE_CERTIFICATE" | tr -cd 'A-Za-z0-9+/=')
              for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
                export_if_set "$name"
              done
            else
              # Ad-hoc signature so the app runs on Apple Silicon without a Developer ID.
              echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            fi
          fi

          echo "BUILD_ARGS=$build_args" >> "$GITHUB_ENV"

      - name: Build app
        shell: bash
        run: npx tauri build $BUILD_ARGS

      - name: Collect release assets
        shell: bash
        run: >
          node scripts/collect-release-assets.mjs
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --bundle-dir src-tauri/target/${{ matrix.target }}/release/bundle
          --out release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devtools-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          retention-days: 30
          if-no-files-found: error

      - name: Check that the shipped app starts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "src-tauri/target/${{ matrix.target }}/release/DevToolsApp.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "DevToolsApp exited with code $($app.ExitCode)" }
          $app.Refresh()
          Write-Host "Window title: $($app.MainWindowTitle)"
          if ($app.MainWindowTitle -ne "DevToolsApp") { throw "The DevToolsApp window did not open" }
          Stop-Process -Id $app.Id

      - name: Check the upgrade from the Electron version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Get-DevToolsEntries {
            # Some system keys cannot be read on the runner. Skip them.
            Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall", "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue |
              Get-ItemProperty -ErrorAction SilentlyContinue | Where-Object DisplayName -like "DevToolsApp*"
          }

          gh release download v1.3.0 --repo "${{ github.repository }}" --pattern "DevToolsApp-windows-setup.exe" --dir "$env:RUNNER_TEMP\electron"
          Start-Process "$env:RUNNER_TEMP\electron\DevToolsApp-windows-setup.exe" -ArgumentList "/S" -Wait
          # The one-click installer can hand off to a child process, so wait for the files to appear.
          $electronDir = Join-Path $env:LOCALAPPDATA "Programs\devtools"
          $deadline = (Get-Date).AddMinutes(2)
          while (-not ((Test-Path (Join-Path $electronDir "Uninstall DevToolsApp.exe")) -and (Get-DevToolsEntries))) {
            if ((Get-Date) -gt $deadline) { throw "The Electron version did not install to $electronDir" }
            Start-Sleep -Seconds 2
          }
          Start-Sleep -Seconds 5
          Get-Process DevToolsApp -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "Before the upgrade:"
          Get-DevToolsEntries | Format-List PSPath, DisplayName, DisplayVersion, UninstallString
          Get-Content (Join-Path $electronDir "resources\app-update.yml")

          # electron-updater starts the new installer with --updated. CI adds /S to skip the wizard.
          Start-Process "release\DevToolsApp-windows-setup.exe" -ArgumentList "--updated", "/S" -Wait
          Write-Host "After the upgrade:"
          $entries = Get-DevToolsEntries
          $entries | Format-List PSPath, DisplayName, DisplayVersion, UninstallString
          if (Test-Path $electronDir) { throw "The Electron install folder is still present: $electronDir" }
          if (@($entries).Count -ne 1) { throw "Expected one DevToolsApp uninstall entry, found $(@($entries).Count)" }
          $tauriApp = Join-Path $env:LOCALAPPDATA "DevToolsApp\DevToolsApp.exe"
          if (-not (Test-Path $tauriApp)) { throw "The Tauri app is not installed at $tauriApp" }

      - name: Check that the shipped app starts (macOS)
        if: runner.os == 'macOS'
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/DevToolsApp.app/Contents/MacOS/DevToolsApp"
          "$app" &
          pid=$!
          sleep 15
          kill -0 "$pid" || { echo "DevToolsApp exited early"; exit 1; }
          swift e2e/check-window.swift "$pid"
          kill "$pid"

      - name: Run Rust unit tests
        if: matrix.e2e
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      # The e2e build saves files to a test folder instead of the native dialog.
      # On Windows it also opens a WebView2 debugging port for msedgedriver.
      - name: Build app for end-to-end test
        if: matrix.e2e
        run: >
          npx tauri build --target ${{ matrix.target }} --no-bundle
          --features e2e --config e2e/tauri.e2e.conf.json

      - name: Install tauri-driver
        if: matrix.e2e && runner.os == 'Linux'
        run: cargo install tauri-driver --locked

      - name: Install msedgedriver
        if: matrix.e2e && runner.os == 'Windows'
        shell: pwsh
        # msedgedriver must have the same version as the WebView2 runtime.
        run: |
          $key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $version = (Get-ItemProperty -Path $key).pv
          Write-Host "WebView2 runtime version: $version"
          $dir = Join-Path $env:RUNNER_TEMP "msedgedriver"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$dir.zip"
          Expand-Archive "$dir.zip" -DestinationPath $dir -Force
          "NATIVE_DRIVER=$dir\msedgedriver.exe" >> $env:GITHUB_ENV

      - name: Run end-to-end smoke test (Linux)
        if: matrix.e2e && runner.os == 'Linux'
        run: xvfb-run -a node e2e/smoke.mjs src-tauri/target/${{ matrix.target }}/release/DevToolsApp

      - name: Run end-to-end smoke test (Windows)
        if: matrix.e2e && runner.os == 'Windows'
        run: node e2e/smoke.mjs src-tauri/target/${{ matrix.target }}/release/DevToolsApp.exe

      # macOS has no WebDriver for WKWebView, so the e2e build runs an in-app self-test.
      - name: Run end-to-end self-test (macOS)
        if: matrix.e2e && runner.os == 'macOS'
        run: |
          save_dir=$(mktemp -d)
          DEVTOOLS_E2E_SELFTEST=1 DEVTOOLS_E2E_SAVE_DIR="$save_dir" \
            perl -e 'alarm 300; exec @ARGV' src-tauri/target/${{ matrix.target }}/release/DevToolsApp

      - name: Upload e2e screenshots
        if: matrix.e2e && always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.platform }}-${{ matrix.arch }}
          path: e2e/screenshots
          retention-days: 7
          if-no-files-found: ignore
