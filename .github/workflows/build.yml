name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Validate release metadata
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build-app.yml
    with:
      release: true
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: devtools-*
          path: release-assets
          merge-multiple: true

      - name: Display downloaded files
        run: ls -la release-assets

      - name: Create updater manifest
        run: |
          if ls release-assets/*.sig >/dev/null 2>&1; then
            node scripts/create-updater-manifest.mjs "$GITHUB_REF_NAME" --assets release-assets
          else
            echo "::warning::No updater signatures found. Skipping latest.json."
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: release-notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
